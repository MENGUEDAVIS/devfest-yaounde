<!DOCTYPE html>
<html lang="fr" data-base="../">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Équipe — DevFest Yaoundé 2025</title>
    <meta
      name="description"
      content="L'équipe bénévole de GDG Yaoundé qui organise le DevFest : leads, organisateurs, design, WTM et mentors."

    <link rel="icon" href="../assets/img/devfest-logo.svg" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="team">
    <div id="site-nav"></div>

    <main>
      <section class="section section--dark section--round-bottom">
        <div class="container section__head">
          <h1 class="display-lg">Les gens<br />derrière tout ça</h1>
          <p data-field="community.description"></p>

        <div class="container">
          <div class="team-grid" id="team"></div>
          <p class="note" data-field="community.disclaimer"></p>

            <a class="btn btn--dark" href="https://gdg.community.dev/gdg-yaounde/" target="_blank" rel="noopener"
